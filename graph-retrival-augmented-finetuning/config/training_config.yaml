# GRAFT Training Configuration
model:
  name: "distilgpt2"
  max_length: 512

training:
  epochs: 3
  batch_size: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  train_split: 0.8
  seed: 42

generation:
  max_new_tokens: 64
  top_k: 50
  top_p: 0.95
  do_sample: true

output:
  dir: "./pt_graft_model_save"
  save_best_only: true

retrieval:
  num_distractors: 2
  shuffle_facts: true
